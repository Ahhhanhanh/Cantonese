<title>Bao Bao Học Tiếng Quảng</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one column of soft "bun" cards under a sticky chip nav; tone colours run through every Jyutping syllable */
:root{
  --bg:#EAF6F1; --surface:#FFFFFF; --surface2:#F3FAF7; --ink:#24343A; --muted:#5B6F76; --line:#D2E6DE;
  --jade:#2A9A7E; --jade-ink:#FFFFFF; --jade-soft:#D8F1E8;
  --bun:#FFD37A; --bun-ink:#5A3D00; --bun-soft:#FFF1CF;
  --coral:#FF7F72; --coral-soft:#FFE4E0;
  --ok:#21926F; --ok-soft:#DDF4EC; --bad:#D9483F; --bad-soft:#FDE3E1;
  --t1:#F0574F; --t2:#F08A24; --t3:#C99700; --t4:#3D8FE0; --t5:#8B63F0; --t6:#1E9E78;
  --press:rgba(36,52,58,.13);
  --display:"Baloo 2","Nunito","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito","Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;
  --zh:"PingFang HK","Noto Sans HK","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121E1C; --surface:#1B2B28; --surface2:#21342F; --ink:#E8F3EF; --muted:#9DB4AD; --line:#2E4541;
  --jade:#4CC7A3; --jade-ink:#0B1D18; --jade-soft:#1D3D35;
  --bun:#F0C25E; --bun-ink:#2B1E00; --bun-soft:#3A3120;
  --coral:#FF8D82; --coral-soft:#3B2421;
  --ok:#5AD1A8; --ok-soft:#173A31; --bad:#FF7E75; --bad-soft:#3E2120;
  --t1:#FF7A72; --t2:#FFA552; --t3:#E9C23A; --t4:#6DB0FF; --t5:#AD8CFF; --t6:#4CC9A0;
  --press:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121E1C; --surface:#1B2B28; --surface2:#21342F; --ink:#E8F3EF; --muted:#9DB4AD; --line:#2E4541;
  --jade:#4CC7A3; --jade-ink:#0B1D18; --jade-soft:#1D3D35;
  --bun:#F0C25E; --bun-ink:#2B1E00; --bun-soft:#3A3120;
  --coral:#FF8D82; --coral-soft:#3B2421;
  --ok:#5AD1A8; --ok-soft:#173A31; --bad:#FF7E75; --bad-soft:#3E2120;
  --t1:#FF7A72; --t2:#FFA552; --t3:#E9C23A; --t4:#6DB0FF; --t5:#AD8CFF; --t6:#4CC9A0;
  --press:rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 64px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance;font-weight:700}
h2{font-size:1.6rem} h3{font-size:1.22rem} h4{font-size:1.05rem}
p{margin:0}
.zh{font-family:var(--zh);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.grid > *, .grid2 > *, .row > *{min-width:0}

/* header */
.top{display:flex;align-items:center;gap:12px;padding-block:6px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand h1{font-size:1.5rem;color:var(--jade)}
.brand .sub{font-size:.85rem;color:var(--muted);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;background:var(--surface);border:2px solid var(--line);font-weight:800;font-size:.9rem;white-space:nowrap}
.pill.fire{background:var(--bun-soft);border-color:var(--bun);color:var(--ink)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:8px;display:flex;flex-wrap:wrap;gap:8px;border-bottom:2px dashed var(--line);margin-bottom:18px}
.tab{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:5px 12px 5px 6px;font:800 .92rem var(--body);display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.tab .ic{font-family:var(--zh);width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-size:.95rem}
.tab[aria-selected="true"]{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.tab[aria-selected="true"] .ic{background:rgba(255,255,255,.25);color:inherit}
.tab:focus-visible,.btn:focus-visible,.opt:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.chip:focus-visible{outline:3px solid var(--bun);outline-offset:2px}

/* cards & buttons */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 5px 0 var(--press)}
.card.soft{background:var(--surface2);box-shadow:none}
.card.bun{background:var(--bun-soft);border-color:var(--bun)}
.card.jade{background:var(--jade-soft);border-color:var(--jade)}
.btn{appearance:none;border:none;border-radius:16px;padding:10px 18px;font:800 1rem var(--body);cursor:pointer;background:var(--jade);color:var(--jade-ink);box-shadow:0 4px 0 var(--press);transition:transform .08s;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--press)}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.btn.bun{background:var(--bun);color:var(--bun-ink)}
.btn.coral{background:var(--coral);color:#fff}
.btn.sm{padding:6px 12px;font-size:.88rem;border-radius:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.say{appearance:none;border:2px solid var(--line);background:var(--surface);border-radius:12px;width:36px;height:36px;display:inline-grid;place-items:center;cursor:pointer;color:var(--jade);flex:none}
.say svg{width:18px;height:18px}
.say.big{width:64px;height:64px;border-radius:22px;border-width:3px}
.say.big svg{width:32px;height:32px}
.say.playing{background:var(--jade-soft);border-color:var(--jade)}

/* jyutping tones */
.jp{font-weight:800;letter-spacing:.01em;white-space:nowrap}
.jp .s{display:inline-block;margin-right:.28em}
.jp .s:last-child{margin-right:0}
.jp .s sup{font-size:.72em;vertical-align:.45em;margin-left:1px}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}.t6{color:var(--t6)}
.bg1{background:var(--t1)}.bg2{background:var(--t2)}.bg3{background:var(--t3)}.bg4{background:var(--t4)}.bg5{background:var(--t5)}.bg6{background:var(--t6)}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 16px;font-weight:700}
.bubble::before{content:"";position:absolute;left:-10px;top:24px;width:16px;height:16px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface2);border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted);font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{text-align:center;font-size:.75rem;font-weight:800;color:var(--muted)}
.day i{display:block;margin:4px auto 0;width:30px;height:30px;border-radius:50%;border:2px dashed var(--line);font-style:normal;line-height:26px;font-size:.9rem}
.day.done i{background:var(--jade);border:2px solid var(--jade);color:var(--jade-ink)}
.day.today i{border-color:var(--bun);border-style:solid}

.wotd{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.wotd .pic{font-size:3.4rem;width:86px;height:86px;border-radius:26px;display:grid;place-items:center;background:var(--bun-soft);flex:none}
.bigzh{font-family:var(--zh);font-size:2.2rem;font-weight:700;line-height:1.1}

/* roadmap */
.road{display:flex;flex-direction:column;gap:0;position:relative}
.stage{display:grid;grid-template-columns:56px 1fr;gap:14px;position:relative;padding-bottom:18px}
.stage::before{content:"";position:absolute;left:27px;top:56px;bottom:0;width:3px;background:repeating-linear-gradient(var(--line) 0 8px,transparent 8px 14px)}
.stage:last-child::before{display:none}
.node{width:56px;height:56px;border-radius:20px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.4rem;background:var(--surface);border:3px solid var(--line);color:var(--muted)}
.stage.current .node{background:var(--bun);border-color:var(--bun);color:var(--bun-ink)}
.stage.past .node{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.tag{display:inline-block;font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
ul.clean{margin:0;padding-left:1.1em}
ul.clean li{margin:3px 0}

/* lessons */
.lcard{cursor:pointer;display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:inherit;width:100%}
.lcard .pic{font-size:2rem;width:56px;height:56px;border-radius:18px;background:var(--surface2);display:grid;place-items:center;flex:none}
.lcard.done{border-color:var(--jade)}
.check{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--jade);color:var(--jade-ink);font-size:.8rem;font-weight:900}
.words{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.word{display:flex;gap:10px;align-items:center;background:var(--surface2);border-radius:16px;padding:10px 12px}
.word .em{font-size:1.7rem;width:40px;text-align:center;flex:none}
.word .zh{font-size:1.25rem}
.word .meta{flex:1;min-width:0}
.word .v{font-size:.88rem;color:var(--muted);font-weight:700}
.cmp{font-size:.8rem;color:var(--muted)}
.dlg{display:flex;flex-direction:column;gap:10px}
.line{display:flex;gap:10px;align-items:flex-start}
.line .who{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:900;flex:none;font-family:var(--display)}
.line .who.a{background:var(--bun);color:var(--bun-ink)}
.line .who.b{background:var(--jade);color:var(--jade-ink)}
.line .txt{flex:1;min-width:0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:8px 10px;text-align:left;border-bottom:2px solid var(--line);vertical-align:middle}
th{font-family:var(--display);font-weight:700;color:var(--muted);font-size:.85rem;letter-spacing:.04em}

/* tone chart */
.tonegrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,145px),1fr))}
.tonecard{appearance:none;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:10px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:4px}
.tonecard:hover{border-color:var(--jade)}
.tonecard .num{font-family:var(--display);font-weight:800;font-size:1.05rem}
.mouths{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.mouth{background:var(--surface2);border-radius:18px;padding:10px;text-align:center}

/* quiz */
.quiz{max-width:640px;margin:0 auto}
.qbar{height:14px;border-radius:999px;background:var(--surface2);overflow:hidden;border:2px solid var(--line)}
.qbar i{display:block;height:100%;background:var(--jade);border-radius:999px;transition:width .3s}
.qprompt{font-family:var(--display);font-size:1.3rem;font-weight:700}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr))}
.opt{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:18px;padding:12px;font:700 1rem var(--body);cursor:pointer;box-shadow:0 4px 0 var(--press);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.opt.emoji{font-size:2.6rem;padding:8px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.fb.good{background:var(--ok-soft);border:2px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:2px solid var(--bad)}
.fb h4{color:inherit}
.fb ul{margin:6px 0 0;padding-left:1.1em}
.fb .mascot{flex:none}
input[type=text],input[type=email],input[type=time],textarea,select{font:700 1.05rem var(--body);color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 14px;width:100%}
textarea{min-height:90px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px;border-radius:16px;border:2px dashed var(--line);align-items:center}
.chip{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:6px 12px;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;font:inherit;box-shadow:0 3px 0 var(--press)}
.chip .zh{font-size:1.25rem}
.chip .jp{font-size:.72rem}
.chip.used{visibility:hidden}

/* games */
.gcard{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.gcard .pic{height:92px;border-radius:16px;display:grid;place-items:center;font-size:2.6rem}
.pond{position:relative;height:300px;border-radius:22px;background:linear-gradient(var(--jade-soft),var(--surface2));overflow:hidden;border:2px solid var(--line)}
.bub{position:absolute;width:74px;height:74px;border-radius:50%;border:none;color:#fff;font:800 1.5rem var(--display);cursor:pointer;display:grid;place-items:center;box-shadow:inset -6px -8px 0 rgba(0,0,0,.12),inset 6px 6px 0 rgba(255,255,255,.35);animation:float 5s ease-in-out infinite}
.bub small{display:block;font-size:.6rem;font-weight:700;margin-top:-6px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.bub.pop{animation:pop .35s forwards}
@keyframes pop{to{transform:scale(1.6);opacity:0}}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px;margin:0 auto}
.mcard{aspect-ratio:1;max-width:100%;border-radius:16px;border:2px solid var(--line);background:var(--jade);cursor:pointer;display:grid;place-items:center;font:800 .9rem var(--body);color:var(--jade-ink);padding:4px;text-align:center;box-shadow:0 4px 0 var(--press)}
.mcard.open{background:var(--surface);color:var(--ink)}
.mcard.got{background:var(--ok-soft);border-color:var(--ok);color:var(--ink);cursor:default}
.mcard .e{font-size:2rem}
.timer{font-family:var(--display);font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums}

/* songs */
.lyric{display:flex;flex-wrap:wrap;gap:4px 8px;padding:10px 12px;border-radius:16px;align-items:flex-end}
.lyric.cur{background:var(--bun-soft)}
.syl{display:inline-flex;flex-direction:column;align-items:center;border-radius:10px;padding:2px 4px;transition:background .15s}
.syl .zh{font-size:1.5rem;line-height:1.2}
.syl .jp{font-size:.72rem}
.syl.hl{background:var(--bun);color:var(--bun-ink)}
.syl.hl .jp span{color:var(--bun-ink)}
.blank{min-width:2.2em;border-bottom:3px solid var(--coral);display:inline-block;text-align:center}
.shadowbar{height:12px;border-radius:999px;background:var(--surface2);overflow:hidden}
.shadowbar i{display:block;height:100%;width:0;background:var(--coral)}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:min(60vh,560px);overflow-y:auto;padding:4px}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;word-wrap:break-word;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--jade);color:var(--jade-ink);border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--surface2);border:2px solid var(--line);border-bottom-left-radius:6px}
.msg .zhs{font-family:var(--zh);font-weight:700;cursor:pointer;border-bottom:2px dotted var(--jade)}
.msg.me .zhs{border-color:var(--jade-ink)}
.starter{appearance:none;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:6px 12px;font:700 .88rem var(--body);cursor:pointer;text-align:left}

/* writing pad */
.pad{position:relative;width:min(100%,280px);aspect-ratio:1;border-radius:18px;border:3px solid var(--coral);background:var(--surface);touch-action:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:15px}

.banner{background:var(--coral-soft);border:2px solid var(--coral);border-radius:18px;padding:12px 16px;font-weight:700}
.note{background:var(--bun-soft);border-radius:16px;padding:12px 14px}
.mist{display:flex;gap:12px;align-items:flex-start;border-bottom:2px dashed var(--line);padding-block:10px}
.mist:last-child{border-bottom:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;z-index:50;max-width:calc(100% - 32px)}
code,.mono{font-family:ui-monospace,Menlo,monospace;font-size:.9em}
pre.ics{white-space:pre-wrap;word-break:break-all;background:var(--surface2);border-radius:14px;padding:12px;font-size:.78rem;max-height:220px;overflow:auto}
.spin{display:inline-block;width:16px;height:16px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.wiggle{animation:wig 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wig{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}
  .bubble::before{display:none}
  .tab{padding:4px 9px 4px 4px;font-size:.82rem}
  .tab .ic{width:24px;height:24px}
  h2{font-size:1.35rem}
  .mem{gap:6px}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span id="logo"></span>
      <div><h1>Bao Bao Học Tiếng Quảng</h1><div class="sub zh">包包教你講廣東話 · <span class="jp" id="logojp"></span></div></div>
    </div>
    <span class="pill fire" title="Chuỗi ngày học">🔥 <span id="streakPill">0</span> ngày</span>
    <span class="pill" title="Điểm kinh nghiệm">⭐ <span id="xpPill">0</span> XP</span>
    <button class="pill" id="speedBtn" style="cursor:pointer" title="Tốc độ đọc">🐢 Đọc chậm</button>
    <button class="pill" id="soundBtn" style="cursor:pointer" title="Kiểm tra âm thanh">🔈 Âm thanh</button>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div id="soundPanel" hidden></div>
  <div id="voiceBanner" hidden></div>
  <main id="view"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="audio.js"></script>
<script>
/* =========================================================
   DATA
   ========================================================= */
const TONES = {
  1:{name:"Thanh 1",pitch:"55",short:"cao, bằng",viet:"Như thanh ngang nhưng cao hơn, giữ giọng như đang hát nốt cao.",pts:[5,5]},
  2:{name:"Thanh 2",pitch:"25",short:"đi lên cao",viet:"Như dấu sắc kéo dài, vút lên giống khi hỏi lại “hả?”.",pts:[2,5]},

const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pick = a=>a[Math.floor(Math.random()*a.length)];
const shuffle = a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function seeded(seed){let t=seed>>>0;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}
function seededShuffle(a,rnd){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function jp(str){
  return `<span class="jp">${String(str).split(/\s+/).filter(Boolean).map(s=>{
    const m=s.match(/^([^0-9]*?)([1-6])([^a-z0-9]*)$/i);
    if(!m) return `<span class="s">${esc(s)}</span>`;
    return `<span class="s t${m[2]}">${esc(m[1])}<sup>${m[2]}</sup>${esc(m[3])}</span>`;
  }).join("")}</span>`;
}

function toneSVG(n,w=120,hgt=70,showGrid=true){
  const t=TONES[n]; const y=v=>hgt-8-(v-1)*(hgt-16)/4; const x0=14,x1=w-10;
  let grid="";
  if(showGrid){for(let i=1;i<=5;i++)grid+=`<line x1="${x0}" x2="${x1}" y1="${y(i)}" y2="${y(i)}" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="3 4"/><text x="2" y="${y(i)+4}" font-size="10" fill="var(--muted)" font-family="Nunito">${i}</text>`}
  const [a,b]=t.pts; const mx=(x0+x1)/2;
  const path = n===4?`M${x0} ${y(a)} Q ${mx} ${y(a)} ${x1} ${y(b)}`:`M${x0} ${y(a)} Q ${mx} ${y((a+b)/2+(b>a?-.25:0))} ${x1} ${y(b)}`;
  return `<svg viewBox="0 0 ${w} ${hgt}" width="100%" style="max-width:${w}px" aria-hidden="true">${grid}<path d="${path}" fill="none" stroke="var(--t${n})" stroke-width="6" stroke-linecap="round"/><circle cx="${x1}" cy="${y(b)}" r="5" fill="var(--t${n})"/></svg>`;
}
function bigToneChart(){
  const w=520,hgt=230,x0=40,x1=w-20; const y=v=>hgt-30-(v-1)*(hgt-60)/4;
  let s=`<svg viewBox="0 0 ${w} ${hgt}" width="100%" style="max-width:600px" role="img" aria-label="Biểu đồ cao độ 6 thanh">`;
  for(let i=1;i<=5;i++){s+=`<line x1="${x0}" x2="${x1}" y1="${y(i)}" y2="${y(i)}" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 5"/><text x="8" y="${y(i)+5}" font-size="13" font-weight="700" fill="var(--muted)" font-family="Nunito">${i}</text>`}
  s+=`<text x="${x0}" y="${hgt-6}" font-size="12" fill="var(--muted)" font-family="Nunito">Cao độ 1 = thấp nhất · 5 = cao nhất</text>`;
  const seg=(x1-x0)/6;
  for(let n=1;n<=6;n++){const [a,b]=TONES[n].pts;const sx=x0+seg*(n-1)+10,ex=sx+seg-24;
    s+=`<path d="M${sx} ${y(a)} L ${ex} ${y(b)}" stroke="var(--t${n})" stroke-width="7" stroke-linecap="round" fill="none"/><circle cx="${ex}" cy="${y(b)}" r="6" fill="var(--t${n})"/><text x="${sx}" y="${y(5)-10}" font-size="15" font-weight="800" fill="var(--t${n})" font-family="Baloo 2,Nunito">${n} · ${TONES[n].pitch}</text>`}
  return s+`</svg>`;
}

   ========================================================= */
const TTS = {
  voice:null, none:!("speechSynthesis" in window), checked:false,
  init(){
    if(this.none){this.checked=true;renderVoiceBanner();return}
    const choose=()=>{const vs=speechSynthesis.getVoices(); const c=this.cantonese();
      this.voice = c.find(v=>v.name===state.voiceName) || c[0] || null;
      if(vs.length) {this.checked=true; renderVoiceBanner();}};
    choose(); speechSynthesis.addEventListener?.("voiceschanged",choose);
    setTimeout(()=>{this.checked=true;renderVoiceBanner()},1800);
  },
  cantonese(){return speechSynthesis.getVoices().filter(v=>/^(zh[-_]HK|yue)/i.test(v.lang)||/Sinji|Cantonese|粵|廣東|HiuGaai|HiuMaan|WanLung/i.test(v.name))},
  lastOk:null, lastErr:"", cur:null,
  norm:t=>String(t).replace(/[\s，。！？、…,.!?：:；;「」]/g,""),
  clipIndex:null,
  clip(text){
    const A=window.BAOBAO_AUDIO; if(!A) return null;
    if(A[text]) return A[text];
    if(!this.clipIndex){this.clipIndex={};for(const k in A)this.clipIndex[this.norm(k)]=A[k]}
    return this.clipIndex[this.norm(text)]||null;
  },
  player:null,
  playClip(src,rate){
    return new Promise(res=>{
      const a=this.player||(this.player=new Audio()); try{a.pause()}catch{}
      let done=false; const fin=ok=>{if(!done){done=true;a.onended=a.onerror=null;res(ok)}};
      a.onended=()=>fin(true); a.onerror=()=>fin(false);
      a.src=src; a.preservesPitch=true; a.playbackRate=Math.max(.5,Math.min(1.3,rate*(state.slow?.75:1)));
      const p=a.play(); if(p&&p.catch) p.then(()=>{this.lastOk=true}).catch(()=>fin(false));
      setTimeout(()=>fin(true),12000);
    });
  },
  clipDuration(text){
    const src=this.clip(text); if(!src) return Promise.resolve(0);
    return new Promise(r=>{const a=new Audio();a.preload="metadata";a.onloadedmetadata=()=>r(isFinite(a.duration)?a.duration:0);a.onerror=()=>r(0);a.src=src;setTimeout(()=>r(0),1500)});
  },
  stop(){try{this.player&&this.player.pause()}catch{};try{!this.none&&speechSynthesis.cancel()}catch{}},
  async speak(text,rate=1){
    if(!text) return;
    const src=this.clip(text);
    if(src){const ok=await this.playClip(src,rate); if(ok){this.lastOk=true;return} this.lastErr="audio"}
    if(this.none){this.lastOk=false;return}
    const ss=speechSynthesis;
    if(!this.voice){const c=this.cantonese(); if(c.length) this.voice=c.find(v=>v.name===state.voiceName)||c[0]}
    // Chrome/Electron drop or freeze an utterance queued right after cancel(): clear first, then wait a beat
    if(ss.speaking||ss.pending){try{ss.cancel()}catch{}; await new Promise(r=>setTimeout(r,140))}
    try{ss.resume()}catch{}
    return new Promise(res=>{
      const u=new SpeechSynthesisUtterance(text); this.cur=u; // keep a reference so it is not garbage-collected mid-speech
      if(this.voice){u.voice=this.voice;u.lang=this.voice.lang}else u.lang="zh-HK";
      u.rate=Math.max(.4,Math.min(1.4,rate*(state.slow?.72:.95)));
      let done=false,started=false; const fin=()=>{if(!done){done=true;res()}};
      u.onstart=()=>{started=true;this.lastOk=true};
      u.onend=fin; u.onerror=e=>{this.lastErr=e.error||"error";if(e.error!=="interrupted"&&e.error!=="canceled")this.lastOk=false;fin()};
      setTimeout(()=>{if(!started&&!done){this.lastOk=false;try{ss.cancel()}catch{};fin()}},2500);
      setTimeout(fin,2500+text.length*800);
      ss.speak(u);
    });
  }
};

const DEFAULT_STATE = {xp:0,streak:0,lastDay:"",days:{},lessonsDone:[],mistakes:[],stage:1,slow:false,reminder:{email:"",time:"20:00",days:[1,2,3,4,5,6,0]},songsDone:[],gamesPlayed:0,lastReport:null,today:null};
let state = structuredClone(DEFAULT_STATE);
let dbRef=null, saveTimer=null, sampleFn=null, downloadsNs=null;
try{const raw=localStorage.getItem("baobao-state"); if(raw) state={...state,...JSON.parse(raw)}}catch{}
function save(){
  try{localStorage.setItem("baobao-state",JSON.stringify(state))}catch{}
  if(!dbRef) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{dbRef.set(JSON.parse(JSON.stringify(state))).catch(()=>{})},1500);
}
async function initRuntime(){
  if(!window.claude?.use) return;
  try{
    const [user,db]=await Promise.all([claude.use("user"),claude.use("db")]);
    if(user&&db){const id=await user.id(); if(id){
      dbRef=db.collection("data/users/"+id).doc("progress");
      const snap=await dbRef.get();
      if(snap.exists){const remote=snap.data(); const lx=state.xp||0; if((remote.xp||0)>=lx){state={...DEFAULT_STATE,...structuredClone(remote)}} else save(); refresh();}
      else if(state.xp>0||state.lessonsDone.length) save();
    }}
  }catch{}
  claude.use("sample").then(s=>{sampleFn=s; if(current==="tutor") render()}).catch(()=>{});
  claude.use("downloads").then(d=>{downloadsNs=d}).catch(()=>{});
}
function addXP(n){state.xp+=n;save();updatePills()}
function addMistake(m){
  const key=(m.h||"")+"|"+(m.kind||"");
  state.mistakes=state.mistakes.filter(x=>((x.h||"")+"|"+(x.kind||""))!==key);
  state.mistakes.unshift({...m,date:dayKey()});
  state.mistakes=state.mistakes.slice(0,80); save();
}
function updatePills(){$("#xpPill").textContent=state.xp;$("#streakPill").textContent=currentStreak();$("#speedBtn").textContent=state.slow?"🐢 Đọc chậm: bật":"🐇 Đọc chậm: tắt"}
function currentStreak(){
  if(!state.lastDay) return 0;
  const y=new Date();y.setDate(y.getDate()-1);
  return (state.lastDay===dayKey()||state.lastDay===dayKey(y))?state.streak:0;
}
function markDailyDone(score,total){
  const t=dayKey();
  if(state.lastDay!==t){const y=new Date();y.setDate(y.getDate()-1);state.streak=(state.lastDay===dayKey(y))?state.streak+1:1;state.lastDay=t}
  const prev=state.days[t]; state.days[t]={score:Math.max(score,prev?.score||0),total};
  const keys=Object.keys(state.days).sort(); while(keys.length>120){delete state.days[keys.shift()]}
  save(); updatePills();
}

/* =========================================================
   JYUTPING ERROR DIAGNOSIS
   ========================================================= */
const INITS=["gw","kw","ng","b","p","m","f","d","t","n","l","g","k","h","w","z","c","s","j"];
function parseSyl(s){
  s=s.toLowerCase(); const m=s.match(/^([a-zü]+)([0-9])?$/); if(!m) return null;
  const body=m[1]; let ini="";
  if(body!=="m"&&body!=="ng"){for(const i of INITS){if(body.startsWith(i)&&body.length>i.length){ini=i;break}}}
  return {raw:s,body,ini,fin:body.slice(ini.length),tone:m[2]?+m[2]:0};
}
function tokenize(s){return (String(s).toLowerCase().replace(/ü/g,"yu").match(/[a-z]+[0-9]?/g))||[]}
function toneTip(u,a){
  const pair=[u,a].sort().join("");
  const t={ "25":"Thanh 2 và 5 đều đi lên: thanh 2 vút lên CAO (như dấu sắc), thanh 5 chỉ nhích lên nhẹ từ thấp (như dấu hỏi nhẹ).",
    "36":"Thanh 3 và 6 đều bằng: thanh 3 ở giữa (như thanh ngang), thanh 6 thấp hơn một bậc.",
    "46":"Thanh 4 trầm và chùng xuống (như dấu huyền), thanh 6 thấp nhưng giữ bằng.",
    "13":"Thanh 1 bằng và CAO như hát nốt cao; thanh 3 bằng ở giữa.",
    "45":"Thanh 4 đi xuống, thanh 5 đi lên nhẹ — nghe kỹ hướng giọng cuối âm tiết.",
    "56":"Thanh 5 cuối âm hơi nhích lên; thanh 6 bằng phẳng.",
    "12":"Thanh 1 cao bằng từ đầu, thanh 2 bắt đầu thấp rồi mới vút lên.",
    "23":"Thanh 2 vút lên, thanh 3 giữ ngang."}[pair];
  return t||`Thanh ${a}: ${TONES[a].short} — ${TONES[a].viet}`;
}
function diagnose(input,answer){
  const U=tokenize(input), A=tokenize(answer), msgs=[];
  if(!U.length) return {ok:false,msgs:["Bạn chưa gõ gì. Gõ Jyutping có số thanh, ví dụ: nei5 hou2"]};
  if(U.length!==A.length){
    msgs.push(`Số âm tiết chưa đúng: bạn gõ ${U.length}, cần ${A.length} (mỗi chữ Hán = 1 âm tiết, cách nhau bằng dấu cách).`);
    return {ok:false,msgs};
  }
  U.forEach((us,i)=>{
    const as=A[i]; if(us===as) return;
    let u=parseSyl(us); const a=parseSyl(as); const at=`Âm tiết ${i+1} “${us}” → đúng là “${as}”: `;
    if(!u){msgs.push(at+"không đọc được âm tiết này.");return}
    const part=[];
    if(u.body!==a.body){
      // pinyin habits: explain, then re-parse with the Jyutping letter so the final is judged on its own
      const r=u.body; const habit=r.match(/^(zh|ch|sh|x|q|y|r)/);
      const HAB={zh:["Jyutping không có zh — dùng z.","z"],ch:["Jyutping không có ch — dùng c.","c"],sh:["Jyutping không có sh — dùng s.","s"],x:["Jyutping không dùng x — âm “x” viết là s.","s"],q:["Jyutping không dùng q — viết là c.","c"],y:["Âm “y” trong Jyutping viết là j (人 jan4, 有 jau5).","j"],r:["Tiếng Quảng không có âm r. Chữ Quan thoại đọc r- thường thành j- (人 jan4).","j"]};
      if(habit&&!(habit[1]==="y"&&a.fin.startsWith("yu")&&!a.ini)){part.push(HAB[habit[1]][0]);u=parseSyl(HAB[habit[1]][1]+r.slice(habit[1].length)+(u.tone||""))||u}
      else if(u.ini!==a.ini){
        if(a.ini==="ng"&&!u.ini) part.push("Thiếu âm đầu ng- (như “ngà” tiếng Việt): 我 ngo5, 牛 ngau4.");
        else if(a.ini==="n"&&u.ini==="l") part.push("Âm chuẩn là n-. Nhiều người HK đọc lẫn n→l, nhưng hãy học n- trước.");
        else if(a.ini==="gw"&&u.ini==="g") part.push("Cần gw- (như “qu” trong “qua”), không chỉ g-.");
        else if(a.ini==="kw"&&u.ini==="k") part.push("Cần kw- (k bật hơi + u).");
        else if((a.ini==="b"&&u.ini==="p")||(a.ini==="d"&&u.ini==="t")||(a.ini==="g"&&u.ini==="k")||(a.ini==="z"&&u.ini==="c")) part.push(`“${a.ini}” không bật hơi; “${u.ini}” là bật hơi. Đặt tay trước miệng: ${a.ini} gần như không có gió.`);
        else if((a.ini==="p"&&u.ini==="b")||(a.ini==="t"&&u.ini==="d")||(a.ini==="k"&&u.ini==="g")||(a.ini==="c"&&u.ini==="z")) part.push(`Cần âm bật hơi “${a.ini}” (có luồng gió), không phải “${u.ini}”.`);
        else part.push(`Âm đầu: bạn ghi “${u.ini||"∅"}”, đúng là “${a.ini||"∅ (không có âm đầu)"}”.`);
      }
      if(u.ini!==a.ini&&habit&&!part.some(p=>p.startsWith("Âm đầu"))&&u.body!==a.body&&u.fin===a.fin){part.push(`Âm đầu đúng là “${a.ini||"∅"}”.`)}
      if(u.fin!==a.fin){
        const uf=u.fin.replace(/^h/,""), af=a.fin;
        if(af.replace("aa","a")===uf && af.includes("aa")) part.push("Vần cần “aa” (a dài như “ba”). “a” đơn là a ngắn như “ă”.");
        else if(uf.replace("aa","a")===af && uf.includes("aa")) part.push("Vần là “a” ngắn (như “ă”), không phải “aa” dài.");
        else if(/[ptk]$/.test(af)&&af.slice(0,-1)===uf) part.push(`Thiếu âm cuối -${af.slice(-1)}: đọc “tắc” lại như “thập, bát, lục” trong tiếng Việt.`);
        else if(/[ptk]$/.test(af)&&/[ptk]$/.test(uf)&&af.slice(0,-1)===uf.slice(0,-1)) part.push(`Âm cuối là -${af.slice(-1)}, không phải -${uf.slice(-1)}. Mẹo: Hán Việt thường giữ đúng âm cuối (六 lục → luk6).`);
        else if(/(ng|n|m)$/.test(af)&&/(ng|n|m)$/.test(uf)&&af.replace(/(ng|n|m)$/,"")===uf.replace(/(ng|n|m)$/,"")) part.push(`Âm cuối mũi là -${af.match(/(ng|n|m)$/)[1]}, không phải -${uf.match(/(ng|n|m)$/)[1]}.`);
        else if(af==="yu"||af.startsWith("yu")) part.push("Âm ü viết là “yu” trong Jyutping (書 syu1, 魚 jyu4).");
        else if(af.startsWith("eo")||af.startsWith("oe")) part.push(`Vần “${af}” tròn môi (như “ơ” tròn môi). Jyutping viết ${af}, không giống pinyin.`);
        else part.push(`Vần: bạn ghi “${u.fin||"∅"}”, đúng là “${af}”.`);
      }
    }
    if(!u.tone) part.push("Thiếu số thanh điệu — luôn ghi số 1–6 cuối âm tiết.");
    else if(u.tone>6) part.push("Thanh điệu chỉ từ 1 đến 6.");
    else if(u.tone!==a.tone) part.push(`Thanh: bạn ghi ${u.tone} (${TONES[u.tone].short}), đúng là ${a.tone} (${TONES[a.tone].short}). ${toneTip(u.tone,a.tone)}`);
    msgs.push(at+part.join(" "));
  });
  return {ok:msgs.length===0,msgs};
}

/* =========================================================
   QUESTION GENERATORS
   ========================================================= */
function poolForStage(stage=state.stage){return uniqWords(ALLWORDS.filter(w=>w.stage<=stage))}
function makeToneQ(rnd=Math.random){
  const set=TONE_SETS[Math.floor(rnd()*TONE_SETS.length)], i=Math.floor(rnd()*6), tone=i+1, ch=set.chars[i];
  return {type:"choice",kind:"tone",say:ch,autoSay:true,h:ch,j:set.base+tone,v:set.v[i],
    prompt:`Nghe và chọn thanh điệu của <b>${set.base}?</b>`,
    opts:[1,2,3,4,5,6].map(n=>({html:`<span class="t${n}" style="font-family:var(--display);font-size:1.2rem;font-weight:800">${n}</span>${toneSVG(n,90,44,false)}<span class="small muted">${TONES[n].short}</span>`,correct:n===tone,
      why:n===tone?"":`Bạn chọn thanh ${n} (${TONES[n].short}). Đây là thanh ${tone}: ${toneTip(n,tone)}`})),
    reveal:`<span class="zh" style="font-size:1.6rem">${ch}</span> ${jp(set.base+tone)} · ${esc(set.v[i])}`};
}
function makePicQ(pool,rnd=Math.random){
  const p=pool.filter(w=>w.e); const w=p[Math.floor(rnd()*p.length)];
  const others=seededShuffle(p.filter(x=>x.e!==w.e&&x.h!==w.h),rnd).slice(0,3);
  return {type:"choice",kind:"pic",say:w.h,autoSay:true,h:w.h,j:w.j,v:w.v,emojiOpts:true,
    prompt:"Nghe và chọn hình đúng",
    opts:seededShuffle([w,...others],rnd).map(o=>({html:o.e,correct:o.h===w.h,why:o.h===w.h?"":`Hình bạn chọn là “${o.v}” = ${o.h} (${o.j}). Từ vừa nghe là ${w.h} (${w.j}) = ${w.v}.`})),
    reveal:`<span class="zh" style="font-size:1.6rem">${w.h}</span> ${jp(w.j)} · ${esc(w.v)}`};
}
function makeMeaningQ(pool,rnd=Math.random){
  const w=pool[Math.floor(rnd()*pool.length)];
  const others=seededShuffle(pool.filter(x=>x.v!==w.v),rnd).slice(0,3);
  return {type:"choice",kind:"meaning",say:w.h,h:w.h,j:w.j,v:w.v,
    prompt:`<span class="zh" style="font-size:2rem">${w.h}</span><br>${jp(w.j)} nghĩa là gì?`,
    opts:seededShuffle([w,...others],rnd).map(o=>({html:esc(o.v),correct:o.v===w.v,why:o.v===w.v?"":`“${o.v}” là ${o.h} (${o.j}). ${w.h} = ${w.v}${w.hv?` (Hán Việt: ${w.hv})`:""}.`})),
    reveal:`${w.h} ${jp(w.j)} = ${esc(w.v)}`};
}
function makeTypeQ(pool,rnd=Math.random){
  const p=pool.filter(w=>w.j.split(" ").length<=3); const w=p[Math.floor(rnd()*p.length)];
  return {type:"type",kind:"type",say:w.h,autoSay:true,h:w.h,j:w.j,v:w.v,
    prompt:`Gõ Jyutping cho <span class="zh" style="font-size:1.6rem">${w.h}</span> <span style="font-size:1.4rem">${w.e||""}</span><br><span class="small muted">${esc(w.v)}${w.hv?` · Hán Việt: ${esc(w.hv)}`:""}</span>`};
}
function makeSwapQ(rnd=Math.random){
  const s=SWAP_Q[Math.floor(rnd()*SWAP_Q.length)];
  return {type:"build",kind:"swap",h:s.ans.join(""),j:s.ans.map(t=>TOKEN_JP[t]).join(" "),v:s.v,ans:s.ans,bank:seededShuffle([...s.ans,...s.dis],rnd),
    prompt:`Đổi câu Quan thoại sang tiếng Quảng:<br><span class="zh" style="font-size:1.4rem">${s.m}</span><br><span class="small muted">${esc(s.v)}</span>`};
}
function makeSongQ(rnd=Math.random){
  const song=SONGS[Math.floor(rnd()*SONGS.length)]; const li=Math.floor(rnd()*song.lines.length); const [hz,jy,vi]=song.lines[li];
  const chars=[...hz], syls=jy.split(" "); const bi=Math.floor(rnd()*chars.length);
  const allChars=[...new Set(song.lines.flatMap(l=>[...l[0]]))].filter(c=>c!==chars[bi]);
  const opts=seededShuffle([chars[bi],...seededShuffle(allChars,rnd).slice(0,3)],rnd);
  const lineHtml=chars.map((c,i)=>i===bi?`<span class="blank">?</span>`:`<span class="zh">${c}</span>`).join("");
  return {type:"choice",kind:"song",say:hz,autoSay:true,h:chars[bi],j:syls[bi],v:`(trong bài ${song.zh})`,
    prompt:`Nghe câu hát trong <b>${song.zh}</b> và điền chữ còn thiếu:<br><span style="font-size:1.6rem">${lineHtml}</span><br><span class="small muted">${esc(vi)}</span>`,
    opts:opts.map(c=>{const k=[...hz].indexOf(c);return {html:`<span class="zh" style="font-size:1.6rem">${c}</span>`,correct:c===chars[bi],why:c===chars[bi]?"":`Chữ đúng là ${chars[bi]} (${syls[bi]}). Cả câu: ${hz} — ${jy}.`}}),
    reveal:`${hz} ${jp(jy)}`};
}
function makeWriteQ(pool,rnd=Math.random){
  const w=pool[Math.floor(rnd()*pool.length)];
  return {type:"write",kind:"write",h:w.h,j:w.j,v:w.v,word:w,
    prompt:`Thử thách sáng tạo: viết một câu tiếng Quảng có dùng <span class="zh" style="font-size:1.4rem">${w.h}</span> ${jp(w.j)} (${esc(w.v)}).<br><span class="small muted">Gõ chữ Hán, Jyutping, hoặc cả hai đều được.</span>`};
}
function makeCafeQ(step){
  const c=CAFE[step];
  return {type:"choice",kind:"cafe",say:c.say,autoSay:!!c.say,h:c.say||c.opts[0][0],j:c.j||c.opts[0][1],v:c.v,
    prompt:`${c.say?`<span class="zh" style="font-size:1.4rem">伙計：${c.say}</span><br>${jp(c.j)}${c.v?` <span class="small muted">· ${esc(c.v)}</span>`:""}<br>`:""}${esc(c.prompt)}`,
    opts:shuffle(c.opts).map(o=>({html:`<span class="zh" style="font-size:1.1rem">${o[0]}</span>${o[1]?jp(o[1]):""}`,correct:o[2],why:o[2]?"":o[3],good:o[2]?o[3]:"",say:o[1]?o[0]:""}))};
}
function buildDaily(){
  const t=dayKey(); const seed=[...t].reduce((a,c)=>a*31+c.charCodeAt(0),7)+state.stage*101;
  const rnd=seeded(seed); const pool=poolForStage();
  const qs=[makeToneQ(rnd),makePicQ(pool,rnd),makeMeaningQ(pool,rnd),makeToneQ(rnd),makeTypeQ(pool,rnd),makePicQ(pool,rnd),makeSwapQ(rnd),makeTypeQ(pool,rnd),makeSongQ(rnd),makeWriteQ(pool,rnd)];
  return qs;
}
function wordOfDay(){const t=dayKey();const seed=[...t].reduce((a,c)=>a*17+c.charCodeAt(0),3);const p=poolForStage();return p[seed%p.length]}

function runQuiz(el,qs,{title="Luyện tập",onDone,onExit,xpEach=10}={}){
  let idx=0,score=0; const wrong=[];
  const header=()=>`<div class="row" style="justify-content:space-between"><h3>${esc(title)}</h3><button class="btn ghost sm" data-act="exit">Thoát</button></div>
    <div class="qbar" aria-label="Tiến độ"><i style="width:${idx/qs.length*100}%"></i></div><div class="small muted">Câu ${Math.min(idx+1,qs.length)} / ${qs.length}</div>`;
  function show(){
    if(idx>=qs.length) return finish();
    const q=qs[idx];
    let body="";
    if(q.type==="choice") body=`<div class="opts">${q.opts.map((o,i)=>`<button class="opt${q.emojiOpts?" emoji":""}" data-i="${i}">${o.html}</button>`).join("")}</div>`;
    if(q.type==="type") body=`<div class="row"><input type="text" id="qtype" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ví dụ: nei5 hou2" style="flex:1"><button class="btn" data-act="check">Kiểm tra</button></div>
      <div class="small muted">Gợi ý: <button class="btn ghost sm" data-act="hint">Xem thanh điệu</button> <span id="hint"></span></div>`;
    if(q.type==="build") body=`<div class="chips" id="picked" aria-label="Câu của bạn"><span class="small muted" id="ph">Chạm vào các thẻ bên dưới để ghép câu</span></div>
      <div class="chips" style="border-style:solid">${q.bank.map((t,i)=>`<button class="chip" data-b="${i}"><span class="zh">${t}</span><span class="jp">${TOKEN_JP[t]?jp(TOKEN_JP[t]):"<span class='muted'>Quan thoại</span>"}</span></button>`).join("")}</div>
      <div class="row"><button class="btn" data-act="checkb">Kiểm tra</button><button class="btn ghost sm" data-act="reset">Làm lại</button></div>`;
    if(q.type==="write") body=`<textarea id="qwrite" placeholder="ví dụ: 我好鍾意食蝦餃 / ngo5 hou2 zung1 ji3 sik6 haa1 gaau2"></textarea>
      <div class="row"><button class="btn" data-act="grade">${sampleFn?"Nhờ Bao Bao chấm":"Kiểm tra"}</button><button class="btn ghost sm" data-act="skip">Bỏ qua</button></div>`;
    el.innerHTML=`<div class="quiz stack">${header()}
      <div class="card stack"><div class="row" style="align-items:flex-start;flex-wrap:nowrap">${q.say?sayBtn(q.say,true):mascot(64)}<div class="qprompt" style="flex:1;min-width:0">${q.prompt}</div></div>${body}</div>
      <div id="fb"></div></div>`;
    if(q.autoSay&&q.say) setTimeout(()=>TTS.speak(q.say),250);
    if(q.type==="type") setTimeout(()=>$("#qtype",el)?.focus(),50);
  }
  function feedback(ok,lines,extra=""){
    const fb=$("#fb",el); const q=qs[idx]; const ph=ok?pick(PRAISE):pick(CHEER);
    fb.innerHTML=`<div class="fb ${ok?"good":"bad"}"><span class="mascot">${mascot(56,ok?"happy":"sad")}</span><div style="flex:1;min-width:0">
      <h4><span class="zh">${ph[0]}</span> <span class="small">${jp(ph[1])} · ${ph[2]}</span></h4>
      ${lines.length?`<ul>${lines.map(l=>`<li>${l}</li>`).join("")}</ul>`:""}${extra}
      <div class="row" style="margin-top:10px"><button class="btn" data-act="next">${idx+1>=qs.length?"Xem kết quả":"Câu tiếp"}</button>${q.say?sayBtn(q.say,false,"Nghe lại"):""}</div></div></div>`;
    if(ok) score++; else {wrong.push(q); addMistake({h:q.h,j:q.j,v:q.v,kind:q.kind,note:lines.join(" ").replace(/<[^>]+>/g,"")})}
    $("[data-act=next]",fb)?.focus();
  }
  function finish(){
    const xp=score*xpEach; addXP(xp);
    const pct=score/qs.length, stars=pct>=.9?3:pct>=.6?2:pct>0?1:0;
    el.innerHTML=`<div class="quiz stack"><div class="card stack" style="text-align:center;align-items:center">
      <div class="wiggle">${mascot(120,pct>=.6?"happy":"wow")}</div>
      <h2>${pct>=.9?"Xuất sắc! 犀利！":pct>=.6?"Giỏi lắm! 好叻！":"Cố lên nhé! 加油！"}</h2>
      <div style="font-size:2.2rem;letter-spacing:6px">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>
      <p><b>${score}/${qs.length}</b> câu đúng · +${xp} XP</p>
      ${wrong.length?`<div class="note small" style="text-align:left;width:100%"><b>Đã lưu ${wrong.length} lỗi vào Sổ lỗi</b> để ôn lại: ${wrong.map(w=>`<span class="zh">${esc(w.h)}</span>`).join(" · ")}</div>`:""}
      <div id="extra" style="width:100%"></div>
      <div class="row" style="justify-content:center"><button class="btn" data-act="done">Xong</button></div></div></div>`;
    onDone&&onDone(score,qs.length,$("#extra",el),wrong);
  }
  el.onclick=async e=>{
    const t=e.target.closest("button"); if(!t||t.dataset.say!==undefined) return;
    const q=qs[idx], act=t.dataset.act;
    if(act==="exit"||act==="done"){el.onclick=null; onExit&&onExit(); return}
    if(act==="next"){idx++;show();return}
    if(t.dataset.i!==undefined&&q.type==="choice"){
      const o=q.opts[+t.dataset.i]; $$(".opt",el).forEach((b,i)=>{b.disabled=true;if(q.opts[i].correct)b.classList.add("right")});
      if(!o.correct)t.classList.add("wrong");
      if(o.say) TTS.speak(o.say);
      const lines=[]; if(!o.correct&&o.why)lines.push(esc(o.why)); if(o.correct&&o.good)lines.push(esc(o.good));
      feedback(o.correct,lines,q.reveal?`<div style="margin-top:6px">${q.reveal}</div>`:"");return}
    if(act==="hint"){$("#hint",el).innerHTML=q.j.split(" ").map(s=>{const n=s.slice(-1);return `thanh <b class="t${n}">${n}</b>`}).join(", ");return}
    if(act==="check"){const v=$("#qtype",el).value; const r=diagnose(v,q.j);
      $("#qtype",el).disabled=true; t.disabled=true;
      feedback(r.ok,r.ok?[`Chính xác: <span class="zh">${q.h}</span> ${jp(q.j)}`]:r.msgs.map(esc),r.ok?"":`<div style="margin-top:6px">Đáp án: <span class="zh">${q.h}</span> ${jp(q.j)}</div>`);return}
    if(t.dataset.b!==undefined&&q.type==="build"){
      t.classList.add("used"); $("#ph",el)?.remove();
      const c=document.createElement("button"); c.className="chip"; c.dataset.back=t.dataset.b; c.innerHTML=t.innerHTML; $("#picked",el).appendChild(c);return}
    if(t.dataset.back!==undefined){$(`[data-b="${t.dataset.back}"]`,el).classList.remove("used");t.remove();return}
    if(act==="reset"){q.picked=[];show();return}
    if(act==="checkb"){
      const picked=$$("#picked .chip",el).map(c=>q.bank[+c.dataset.back]);
      const ok=picked.join("")===q.ans.join("");
      const lines=[]; picked.forEach(p=>{if(MANDARIN_WHY[p])lines.push(`❌ ${esc(MANDARIN_WHY[p])}`)});
      if(!ok&&!lines.length) lines.push(picked.length<q.ans.length?"Câu còn thiếu từ.":"Trật tự từ chưa đúng.");
      $$("button.chip,[data-act=checkb]",el).forEach(b=>b.disabled=true);
      feedback(ok,ok?[`<span class="zh">${q.ans.join("")}</span> ${jp(q.j)}`]:lines,ok?"":`<div style="margin-top:6px">Đáp án: <span class="zh">${q.ans.join("")}</span> ${jp(q.j)}</div>`);
      TTS.speak(q.ans.join(""));return}
    if(act==="skip"){idx++;show();return}
    if(act==="grade"){
      const v=$("#qwrite",el).value.trim(); if(!v){toast("Viết một câu trước đã nhé!");return}
      t.disabled=true;
      if(!sampleFn){feedback(true,[`Bao Bao chưa chấm tự động được ở chế độ xem này. Câu mẫu: <span class="zh">${esc(sampleExample(q.word))}</span>`,"Tự so sánh: có dùng đúng từ, đúng thanh, không dùng từ kiểu Quan thoại (是 不 的 他 在…) không?"]);return}
      t.innerHTML=`<span class="spin"></span> Bao Bao đang chấm…`;
      try{
        const r=await sampleFn.json(`Bạn là giáo viên tiếng Quảng Đông (Hong Kong) chấm bài cho người Việt mới học. Học viên phải viết 1 câu có dùng từ "${q.word.h}" (${q.word.j}, nghĩa: ${q.word.v}). Câu của học viên: """${v}"""
Chấm thân thiện. Trả về JSON đúng dạng: {"ok": boolean (true nếu câu tự nhiên, đúng ngữ pháp tiếng Quảng và có dùng từ), "corrected_hanzi": "câu đã sửa bằng chữ phồn thể", "corrected_jyutping": "jyutping có số thanh", "meaning_vi": "nghĩa tiếng Việt", "mistakes": [{"wrong":"phần sai","right":"phần đúng","why":"giải thích ngắn bằng tiếng Việt (vd: dùng từ Quan thoại, sai thanh, sai trật tự)"}], "praise": "1 câu khen/động viên tiếng Việt"}`,{modelTier:"quick"});
        const lines=[]; if(r.praise)lines.push(esc(r.praise));
        (r.mistakes||[]).forEach(m=>lines.push(`❌ <span class="zh">${esc(m.wrong)}</span> → ✅ <span class="zh">${esc(m.right)}</span>: ${esc(m.why)}`));
        feedback(!!r.ok,lines,`<div style="margin-top:6px">Câu chuẩn: <span class="zh">${esc(r.corrected_hanzi)}</span> ${jp(r.corrected_jyutping||"")}<br><span class="small muted">${esc(r.meaning_vi||"")}</span> ${r.corrected_hanzi?sayBtn(r.corrected_hanzi):""}</div>`);
      }catch(err){t.disabled=false;t.textContent="Thử chấm lại";toast(err?.code==="rate_limited"?"Bao Bao hơi bận, thử lại sau ít phút nhé.":"Chưa chấm được, bạn thử lại nhé.")}
    }
  };
  el.onkeydown=e=>{if(e.key==="Enter"&&e.target.id==="qtype"){$("[data-act=check]",el)?.click()}};
  show();
}
function sampleExample(w){

  return ex[w.h]||`我鍾意${w.h}。`;
}

function startDaily(v){

    onDone:(score,total,extra,wrong)=>{markDailyDone(score,total);state.lastReport={date:dayKey(),score,total,wrong:wrong.map(w=>`${w.h} (${w.j})`)};save();

function reportText(){
  const r=state.lastReport||{date:dayKey(),score:0,total:0,wrong:[]};
  return `Phiếu nộp bài tiếng Quảng · ${r.date.split("-").reverse().join("/")}

Cần ôn: ${r.wrong.length?r.wrong.join(", "):"không có lỗi nào"}
— Gửi từ Bao Bao Học Tiếng Quảng`;
}
function showReport(v){

    <p class="small muted">Nút “Mở ứng dụng email” mở thư nháp sẵn nội dung; bạn tự bấm gửi trong ứng dụng email. Nếu nút không mở được, hãy sao chép nội dung rồi dán vào email.</p>
  </div></div>`;
  $("#repTo").oninput=e=>{state.reminder.email=e.target.value.trim();save();$("#mailLink").href=`mailto:${encodeURIComponent(state.reminder.email)}?subject=${subj}&body=${body}`};
  $("#copyRep").onclick=()=>copyText(txt,$("#repTxt"));
  $("#back").onclick=()=>go("home");
}
function copyText(txt,node){
  navigator.clipboard?.writeText(txt).then(()=>toast("Đã sao chép!")).catch(()=>{selectNode(node);toast("Đã chọn sẵn, bấm Cmd/Ctrl+C để sao chép")}) ?? (selectNode(node),toast("Đã chọn sẵn, bấm Cmd/Ctrl+C để sao chép"));
}
function selectNode(n){if(!n)return;const r=document.createRange();r.selectNodeContents(n);const s=getSelection();s.removeAllRanges();s.addRange(r)}

VIEWS.games=v=>{

  v.innerHTML=`<div class="stack"><div><h2>Trò chơi</h2><p class="muted">Mỗi lượt chơi vài phút. Lỗi sai được tự động lưu vào Sổ lỗi để ôn lại.</p></div>
  <div class="grid">${GAMES.map(g=>`<button class="card gcard" data-g="${g.id}"><div class="pic" style="background:${g.bg}">${g.pic}</div><h4>${g.title}</h4><p class="small muted">${g.desc}</p></button>`).join("")}</div></div>`;
  v.onclick=e=>{const b=e.target.closest("[data-g]");if(b){v.onclick=null;playGame(v,b.dataset.g)}};

function playGame(v,id){
  state.gamesPlayed++;save();
  const back=()=>go("games"); const pool=poolForStage();
  if(id==="tone") return toneBubbles(v,back);
  if(id==="memory") return memoryGame(v,back);
  if(id==="numbers") return numberRace(v,back);
  const qs = id==="cafe"?CAFE.map((_,i)=>makeCafeQ(i)) : id==="swap"?shuffle(SWAP_Q).slice(0,5).map(s=>{const q=makeSwapQ();const ss=s;return {...q,h:ss.ans.join(""),j:ss.ans.map(t=>TOKEN_JP[t]).join(" "),v:ss.v,ans:ss.ans,bank:shuffle([...ss.ans,...ss.dis]),prompt:`Đổi câu Quan thoại sang tiếng Quảng:<br><span class="zh" style="font-size:1.4rem">${ss.m}</span><br><span class="small muted">${esc(ss.v)}</span>`}})
    : id==="type"?[...Array(6)].map(()=>makeTypeQ(pool)) : [...Array(8)].map(()=>makePicQ(pool));
  runQuiz(v,qs,{title:GAMES.find(g=>g.id===id).title,onExit:back,onDone:()=>{}});
}
function toneBubbles(v,back){
  let round=0,score=0; const total=10;
  function next(){
    if(round>=total){addXP(score*5);v.innerHTML=`<div class="quiz card stack" style="text-align:center;align-items:center">${mascot(110,"happy")}<h2>Chọc trúng ${score}/${total} quả bóng!</h2><p>+${score*5} XP</p><div class="row"><button class="btn" id="again">Chơi lại</button><button class="btn ghost" id="bk">Về danh sách</button></div></div>`;$("#again").onclick=()=>toneBubbles(v,back);$("#bk").onclick=back;return}
    const q=makeToneQ(); const tone=q.opts.findIndex(o=>o.correct)+1; const set=TONE_SETS.find(s=>s.chars.includes(q.say));
    v.innerHTML=`<div class="quiz stack"><div class="row" style="justify-content:space-between"><h3>Bong bóng thanh điệu</h3><span class="pill">Lượt ${round+1}/${total} · ⭐ ${score}</span><button class="btn ghost sm" id="bk">Thoát</button></div>
      <div class="row">${sayBtn(q.say,true,"Nghe lại")}<p><b>Nghe “${set.base}?”</b> rồi chọc quả bóng đúng thanh.</p></div>
      <div class="pond" id="pond"></div><div id="msg" style="min-height:64px"></div></div>`;
    $("#bk").onclick=back;
    const pond=$("#pond"); const W=pond.clientWidth;
    shuffle([1,2,3,4,5,6]).forEach((n,i)=>{const b=document.createElement("button");b.className=`bub bg${n}`;b.innerHTML=`${n}<small>${TONES[n].pitch}</small>`;b.setAttribute("aria-label",`Thanh ${n}`);
      const col=i%3,row=Math.floor(i/3); b.style.left=`${(col+.5)*W/3-37+((i*37)%30-15)}px`; b.style.top=`${30+row*130+((i*53)%30)}px`; b.style.animationDelay=`${i*.4}s`;
      b.onclick=()=>{$$(".bub",pond).forEach(x=>x.disabled=true);
        if(n===tone){score++;b.classList.add("pop");$("#msg").innerHTML=`<div class="fb good">${mascot(48)}<div><b>${pick(PRAISE)[0]}</b> ${q.reveal}</div></div>`}
        else{b.style.opacity=.4;addMistake({h:q.h,j:q.j,v:q.v,kind:"tone",note:`Nhầm thanh ${n} với thanh ${tone}. ${toneTip(n,tone)}`});$("#msg").innerHTML=`<div class="fb bad">${mascot(48,"sad")}<div><b>Thanh ${tone} mới đúng.</b> ${esc(toneTip(n,tone))}<br>${q.reveal}</div></div>`}
        round++; setTimeout(next,n===tone?1400:2800)};
      pond.appendChild(b)});
    setTimeout(()=>TTS.speak(q.say),300);
  }
  next();
}
function memoryGame(v,back){
  const words=shuffle(poolForStage().filter(w=>w.e&&w.j.split(" ").length<=2)).slice(0,6);
  const cards=shuffle(words.flatMap((w,i)=>[{k:i,type:"e",w},{k:i,type:"j",w}]));
  let open=[],got=0,flips=0,lock=false;
  v.innerHTML=`<div class="quiz stack"><div class="row" style="justify-content:space-between"><h3>Lật thẻ trí nhớ</h3><span class="pill" id="fl">Lượt lật: 0</span><button class="btn ghost sm" id="bk">Thoát</button></div>
    <p class="small muted">Ghép hình với Jyutping đúng nghĩa. Mỗi lần lật thẻ chữ, Bao Bao sẽ đọc to.</p>
    <div class="mem">${cards.map((c,i)=>`<button class="mcard" data-c="${i}" aria-label="Thẻ úp">?</button>`).join("")}</div><div id="msg"></div></div>`;
  $("#bk").onclick=back;
  $(".mem",v).onclick=e=>{const b=e.target.closest("[data-c]");if(!b||lock||b.classList.contains("open")||b.classList.contains("got"))return;
    const c=cards[+b.dataset.c]; b.classList.add("open"); b.innerHTML=c.type==="e"?`<span class="e">${c.w.e}</span>`:`<span>${jp(c.w.j)}</span>`; if(c.type==="j")TTS.speak(c.w.h);
    open.push([b,c]); if(open.length<2)return; flips++; $("#fl").textContent=`Lượt lật: ${flips}`;
    const [[b1,c1],[b2,c2]]=open; open=[];
    if(c1.k===c2.k&&c1.type!==c2.type){b1.classList.add("got");b2.classList.add("got");got++;$("#msg").innerHTML=`<p><span class="zh">${c1.w.h}</span> ${jp(c1.w.j)} = ${esc(c1.w.v)}</p>`;
      if(got===words.length){const stars=flips<=9?3:flips<=13?2:1;addXP(stars*10);setTimeout(()=>{$("#msg").innerHTML=`<div class="fb good">${mascot(56)}<div><h4>Hoàn thành sau ${flips} lượt! ${"⭐".repeat(stars)}</h4><p>+${stars*10} XP</p><div class="row" style="margin-top:8px"><button class="btn sm" id="again">Chơi lại</button></div></div></div>`;$("#again").onclick=()=>memoryGame(v,back)},500)}}
    else{lock=true;setTimeout(()=>{[b1,b2].forEach(x=>{x.classList.remove("open");x.textContent="?"});lock=false},950)}};
}
function numToZh(n){const d="零一二三四五六七八九";if(n<10)return d[n];if(n===10)return"十";if(n<20)return"十"+d[n%10];return d[Math.floor(n/10)]+"十"+(n%10?d[n%10]:"")}
function numToJp(n){const d=["ling4","jat1","ji6","saam1","sei3","ng5","luk6","cat1","baat3","gau2"];if(n<10)return d[n];if(n===10)return"sap6";if(n<20)return"sap6 "+d[n%10];return d[Math.floor(n/10)]+" sap6"+(n%10?" "+d[n%10]:"")}
function numberRace(v,back){
  let score=0,left=60,cur=0,timer=null,started=false; const miss=[];
  v.innerHTML=`<div class="quiz stack"><div class="row" style="justify-content:space-between"><h3>Đua số 60 giây</h3><span class="timer" id="tm">60s</span><button class="btn ghost sm" id="bk">Thoát</button></div>
    <div class="card stack" style="align-items:center;text-align:center">${mascot(80,"wow")}<p>Nghe số (1–99) rồi gõ bằng chữ số. Nhấn Enter để trả lời.</p>
    <div class="row" style="justify-content:center">${`<button class="say big" id="rep" aria-label="Nghe lại">${SPEAKER}</button>`}<input type="text" inputmode="numeric" id="numIn" style="width:140px;text-align:center;font-size:1.6rem" disabled></div>
    <button class="btn" id="go">Bắt đầu</button><div id="last" class="small"></div><div class="pill">Đúng: <b id="sc">0</b></div></div></div>`;
  $("#bk").onclick=()=>{clearInterval(timer);back()};
  const newNum=()=>{cur=1+Math.floor(Math.random()*99);TTS.speak(numToZh(cur),1.05)};
  $("#rep").onclick=()=>cur&&TTS.speak(numToZh(cur),.9);
  $("#go").onclick=()=>{if(started)return;started=true;$("#go").hidden=true;const inp=$("#numIn");inp.disabled=false;inp.focus();newNum();
    timer=setInterval(()=>{left--;$("#tm").textContent=left+"s";if(left<=0){clearInterval(timer);inp.disabled=true;addXP(score*3);
      $("#last").innerHTML=`<div class="fb good" style="text-align:left">${mascot(48)}<div><h4>Hết giờ! Bạn nghe đúng ${score} số.</h4><p>+${score*3} XP</p>${miss.length?`<p class="small">Số cần luyện: ${miss.slice(0,5).map(n=>`${n} = <span class="zh">${numToZh(n)}</span> ${jp(numToJp(n))}`).join(" · ")}</p>`:""}<button class="btn sm" id="again">Chơi lại</button></div></div>`;$("#again").onclick=()=>numberRace(v,back)}},1000)};
  $("#numIn").onkeydown=e=>{if(e.key!=="Enter")return;const val=parseInt(e.target.value,10);e.target.value="";
    if(val===cur){score++;$("#sc").textContent=score;$("#last").innerHTML=`✅ ${cur} = <span class="zh">${numToZh(cur)}</span> ${jp(numToJp(cur))}`}
    else{miss.push(cur);addMistake({h:numToZh(cur),j:numToJp(cur),v:`số ${cur}`,kind:"number",note:`Nghe nhầm số ${cur} thành ${isNaN(val)?"(trống)":val}.`});$("#last").innerHTML=`❌ Số đúng là ${cur} = <span class="zh">${numToZh(cur)}</span> ${jp(numToJp(cur))}`}
    newNum()};
}

function songView(v,song){
  let mode="listen", playing=false, stop=false;
  const lineHTML=(l,li,blankIdx=-1)=>{const cs=[...l[0]],ss=l[1].split(" ");return `<div class="lyric" data-li="${li}">${cs.map((c,i)=>`<span class="syl" data-si="${i}">${i===blankIdx?`<span class="zh blank">?</span><span class="jp">&nbsp;</span>`:`<span class="zh">${c}</span>${jp(ss[i]||"")}`}</span>`).join("")}<span class="small muted" style="flex-basis:100%">${esc(l[2])}</span></div>`};
  function frame(inner){
    v.innerHTML=`<div class="stack"><div class="row"><button class="btn ghost sm" id="bkS">← Danh sách bài</button></div>
    <section class="card stack"><div class="row" style="flex-wrap:nowrap"><span style="font-size:2.6rem">${song.pic}</span><div><h2><span class="zh">${song.zh}</span> · ${esc(song.title)}</h2><p class="small muted">${esc(song.src)}</p></div></div>
    <div class="row" role="tablist">${[["listen","Nghe & đọc theo"],["fill","Điền chỗ trống"],["shadow","Nhép theo"]].map(m=>`<button class="btn ${mode===m[0]?"":"ghost"} sm" data-mode="${m[0]}">${m[1]}</button>`).join("")}</div></section>
    <section class="card stack" id="songBody">${inner}</section></div>`;
    $("#bkS").onclick=()=>{stop=true;go("songs")};
    $$("[data-mode]",v).forEach(b=>b.onclick=()=>{stop=true;TTS.stop();mode=b.dataset.mode;setTimeout(()=>{stop=false;modes[mode]()},50)});
  }
  async function karaoke(li){
    const l=song.lines[li]; const el=$(`[data-li="${li}"]`,v); if(!el)return;
    $$(".lyric",v).forEach(x=>x.classList.remove("cur")); el.classList.add("cur");
    const syl=$$(".syl",el); const dur=await TTS.clipDuration(l[0]);
    const per=dur?Math.max(180,(dur*1000/(.9*(state.slow?.75:1)))/syl.length*0.92):(state.slow?520:400);
    const sp=TTS.speak(l[0],.9);
    for(let i=0;i<syl.length&&!stop;i++){syl.forEach(s=>s.classList.remove("hl"));syl[i].classList.add("hl");await new Promise(r=>setTimeout(r,per))}
    await sp; syl.forEach(s=>s.classList.remove("hl"));
  }
  const modes={
    listen(){
      frame(`<div class="row"><button class="btn" id="playSong">▶ Phát cả bài</button><span class="small muted">Chạm vào từng câu để nghe riêng. Đọc to theo chữ đang sáng.</span></div><div id="lyr">${song.lines.map((l,i)=>lineHTML(l,i)).join("")}</div>`);
      $("#lyr").onclick=e=>{const l=e.target.closest(".lyric");if(l&&!playing)karaoke(+l.dataset.li)};
      $("#playSong").onclick=async e=>{if(playing)return;playing=true;e.target.disabled=true;for(let i=0;i<song.lines.length&&!stop;i++){await karaoke(i);await new Promise(r=>setTimeout(r,300))}playing=false;if(e.target)e.target.disabled=false;
        if(!stop&&!state.songsDone.includes(song.id)){state.songsDone.push(song.id);addXP(10);toast("Hát xong cả bài! +10 XP")}};
    },
    fill(){
      const blanks=song.lines.map(l=>Math.floor(Math.random()*[...l[0]].length)); let li=0,score=0;
      const allChars=[...new Set(song.lines.flatMap(l=>[...l[0]]))];
      function step(){
        if(li>=song.lines.length){addXP(score*4);$("#songBody").innerHTML=`<div class="fb good">${mascot(56)}<div><h4>Điền đúng ${score}/${song.lines.length} chỗ trống!</h4><p>+${score*4} XP</p><button class="btn sm" id="againF" style="margin-top:8px">Làm lại</button></div></div>`;$("#againF").onclick=()=>modes.fill();return}
        const l=song.lines[li], cs=[...l[0]], ss=l[1].split(" "), bi=blanks[li], ans=cs[bi];
        const opts=shuffle([ans,...shuffle(allChars.filter(c=>c!==ans)).slice(0,3)]);
        $("#songBody").innerHTML=`<div class="small muted">Câu ${li+1}/${song.lines.length} · nghe rồi chọn chữ còn thiếu</div>${lineHTML(l,li,bi)}
          <div class="row">${sayBtn(l[0],false,"Nghe câu")}<span class="small">Nghe câu này</span></div>
          <div class="opts">${opts.map(c=>`<button class="opt" data-c="${c}"><span class="zh" style="font-size:1.8rem">${c}</span></button>`).join("")}</div><div id="fbS"></div>`;
        setTimeout(()=>TTS.speak(l[0],.85),200);
        $$(".opt",v).forEach(b=>b.onclick=()=>{$$(".opt",v).forEach(x=>{x.disabled=true;if(x.dataset.c===ans)x.classList.add("right")});
          const ok=b.dataset.c===ans; if(ok)score++; else{b.classList.add("wrong");addMistake({h:ans,j:ss[bi],v:`trong bài ${song.zh}: ${l[0]}`,kind:"song",note:`Chọn ${b.dataset.c} thay vì ${ans} (${ss[bi]}).`})}
          const syl=$$(`[data-li="${li}"] .syl`,v)[bi]; syl.innerHTML=`<span class="zh">${ans}</span>${jp(ss[bi])}`; syl.classList.add("hl");
          $("#fbS").innerHTML=`<div class="fb ${ok?"good":"bad"}">${mascot(48,ok?"happy":"sad")}<div><b>${ok?pick(PRAISE)[0]:`Chữ đúng là ${ans}`}</b> <span class="zh">${ans}</span> ${jp(ss[bi])}${ok?"":` — bạn chọn ${esc(b.dataset.c)}. Nghe lại và để ý âm ${jp(ss[bi])}.`}<div class="row" style="margin-top:8px"><button class="btn sm" id="nx">Câu tiếp</button></div></div></div>`;
          $("#nx").onclick=()=>{li++;step()}});
      }
      frame(""); step();
    },
    shadow(){
      let li=0; const rates=[];
      frame("");
      function step(){
        if(li>=song.lines.length){const avg=rates.reduce((a,b)=>a+b,0)/rates.length;addXP(Math.round(avg*5));
          $("#songBody").innerHTML=`<div class="fb good">${mascot(56)}<div><h4>Nhép theo xong cả bài!</h4><p>Tự chấm trung bình: ${"⭐".repeat(Math.round(avg))} · +${Math.round(avg*5)} XP</p><p class="small">Mẹo: ghi âm giọng mình bằng điện thoại rồi nghe lại so với Bao Bao, bạn sẽ nghe ra thanh nào còn lệch.</p><button class="btn sm" id="againS" style="margin-top:8px">Nhép lại</button></div></div>`;$("#againS").onclick=()=>modes.shadow();return}
        const l=song.lines[li];
        $("#songBody").innerHTML=`<div class="small muted">Câu ${li+1}/${song.lines.length}</div><div id="lyr">${lineHTML(l,li)}</div>
          <div class="row"><button class="btn" id="shGo">▶ Nghe rồi nói theo</button><span class="small muted">Bao Bao đọc chậm 1 lần, sau đó tới lượt bạn nói to.</span></div>
          <div class="shadowbar" aria-hidden="true"><i id="shBar"></i></div><div id="shMsg" class="small" style="min-height:24px"></div><div id="rate"></div>`;
        $("#shGo").onclick=async e=>{e.target.disabled=true;$("#rate").innerHTML="";$("#shMsg").textContent="Nghe nhé…";
          await karaoke(li); if(stop)return; $("#shMsg").innerHTML=`<b>Đến lượt bạn!</b> Nói to: <span class="zh">${l[0]}</span>`;
          const dur=[...l[0]].length*(state.slow?750:600)+800, bar=$("#shBar"); const t0=performance.now();
          await new Promise(r=>{const f=t=>{const p=Math.min(1,(t-t0)/dur);bar.style.width=p*100+"%";if(p<1&&!stop)requestAnimationFrame(f);else r()};requestAnimationFrame(f)});
          if(stop)return; $("#shMsg").textContent="Bạn thấy mình nói thế nào?"; e.target.disabled=false; e.target.textContent="↻ Thử lại câu này";
          $("#rate").innerHTML=`<div class="row">${[[3,"😃 Chuẩn"],[2,"🙂 Gần giống"],[1,"😅 Cần luyện"]].map(r=>`<button class="btn ${r[0]===3?"":"ghost"} sm" data-r="${r[0]}">${r[1]}</button>`).join("")}</div>`;
          $$("[data-r]",v).forEach(b=>b.onclick=()=>{rates.push(+b.dataset.r);if(+b.dataset.r===1)addMistake({h:l[0],j:l[1],v:l[2],kind:"shadow",note:`Câu hát cần luyện thêm trong ${song.zh}.`});li++;step()});};
      }
      step();
    }
  };
  modes.listen();
}

/* tutor */
let chatLog=[];
VIEWS.tutor=v=>{
  const starters=["Sửa giúp mình: 我不是越南人，我是学生","Dạy mình gọi món ở quán trà","Giải thích 咗 và 未 khác nhau thế nào?","Đóng vai: mình hỏi đường ở Mong Kok","唔該 và 多謝 dùng khi nào?","Ra cho mình 3 câu đố về thanh điệu"];
  v.innerHTML=`<div class="stack"><div class="row" style="flex-wrap:nowrap">${mascot(64)}<div><h2>Gia sư Bao Bao</h2><p class="muted small">Hỏi bất cứ điều gì, hoặc viết câu tiếng Quảng (chữ Hán hay Jyutping) để Bao Bao chỉ lỗi sai. Chạm vào chữ Hán trong câu trả lời để nghe.</p></div></div>
  ${sampleFn?"":window.claude?.use?`<div class="banner small">Gia sư cần quyền “hỏi Claude” của trang. Nếu không thấy trả lời, hãy mở trang khi đã đăng nhập claude.ai và cho phép khi được hỏi.</div>`:`<div class="banner small">Gia sư AI chỉ chạy trong bản trên claude.ai. Ở bản tải về này, bạn vẫn dùng được mọi bài học, trò chơi, bài hát và bài tập hằng ngày.</div>`}
  <section class="card stack"><div class="chat" id="chat" aria-live="polite"></div>
  <div class="row" id="starters">${starters.map(s=>`<button class="starter">${esc(s)}</button>`).join("")}</div>
  <form id="chatF" class="row" style="flex-wrap:nowrap"><textarea id="chatIn" rows="2" style="min-height:52px" placeholder="Viết câu hỏi hoặc câu tiếng Quảng của bạn…"></textarea><button class="btn" id="sendB">Gửi</button></form>
  <div class="row"><button class="btn ghost sm" id="clearChat">Cuộc trò chuyện mới</button></div></section></div>`;
  const chat=$("#chat");
  const draw=()=>{chat.innerHTML=(chatLog.length?chatLog:[{role:"assistant",content:"你好！Mình là **Bao Bao** 包包 (baau1 baau1). Hôm nay bạn muốn học gì? Bạn có thể thử viết một câu giới thiệu bản thân bằng tiếng Quảng, mình sẽ sửa cho nhé!"}]).map(m=>`<div class="msg ${m.role==="user"?"me":"bot"}">${fmt(m.content)}</div>`).join("");chat.scrollTop=chat.scrollHeight};
  draw();
  chat.onclick=e=>{const z=e.target.closest(".zhs");if(z)TTS.speak(z.textContent)};
  async function send(text){
    text=text.trim(); if(!text)return;
    if(!sampleFn){toast("Gia sư chưa sẵn sàng ở chế độ xem này.");return}
    chatLog.push({role:"user",content:text}); $("#chatIn").value=""; draw(); $("#starters").hidden=true;
    const bot=document.createElement("div"); bot.className="msg bot"; bot.innerHTML=`<span class="spin"></span> Bao Bao đang nghĩ…`; chat.appendChild(bot); chat.scrollTop=chat.scrollHeight;
    $("#sendB").disabled=true;
    const st=STAGES[state.stage-1]; const recent=state.mistakes.slice(0,5).map(m=>`${m.h} (${m.j})`).join(", ");
    const sys=`[Hướng dẫn cho gia sư — không nhắc lại] Bạn là Bao Bao, chiếc bánh bao dễ thương làm gia sư tiếng Quảng Đông (giọng Hong Kong) cho người Việt. Người học biết tiếng Trung phổ thông cơ bản, đọc được pinyin nhưng đọc được ít chữ Hán. Họ đang ở giai đoạn ${st.n}: "${st.title}". Lỗi gần đây của họ: ${recent||"chưa có"}.
Quy tắc: trả lời bằng tiếng Việt, ngắn gọn (tối đa ~150 chữ), thân thiện, vui vẻ. Mọi từ/câu tiếng Quảng luôn viết: chữ Hán phồn thể + Jyutping có số thanh trong ngoặc + nghĩa tiếng Việt. Khi hữu ích, so sánh với Quan thoại (pinyin) hoặc Hán Việt. Mỗi khi người học viết tiếng Quảng (chữ Hán hoặc Jyutping), LUÔN kiểm tra và liệt kê từng lỗi theo dạng "❌ sai → ✅ đúng: giải thích" (thanh điệu, âm đầu, vần, dùng từ Quan thoại như 是/不/的/他/在, trật tự từ, trợ từ cuối câu); nếu không có lỗi thì khen cụ thể. Kết thúc bằng một câu hỏi nhỏ hoặc bài tập để người học trả lời tiếp. Dùng **đậm** cho từ khoá. Không dùng bảng, không dùng tiêu đề markdown.`;
    const msgs=chatLog.map((m,i)=>i===0&&m.role==="user"?{role:"user",content:sys+"\n\n[Người học]: "+m.content}:m);
    if(msgs[0].role!=="user") msgs.unshift({role:"user",content:sys+"\n\n[Người học]: (bắt đầu)"});
    try{
      const r=await sampleFn(msgs,{cache:false,onText:({text})=>{bot.innerHTML=fmt(text);chat.scrollTop=chat.scrollHeight}});
      chatLog.push({role:"assistant",content:r.text}); draw();
    }catch(err){bot.innerHTML=esc(err?.code==="rate_limited"?"Bao Bao hơi mệt, đợi vài phút rồi hỏi lại nhé.":err?.code==="not_granted"?"Trang chưa được cấp quyền hỏi Claude.":"Có lỗi khi trả lời, bạn gửi lại nhé.");chatLog.pop()}
    $("#sendB").disabled=false;
  }
  $("#chatF").onsubmit=e=>{e.preventDefault();send($("#chatIn").value)};
  $("#chatIn").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(e.target.value)}};
  $("#starters").onclick=e=>{const b=e.target.closest(".starter");if(b)send(b.textContent)};
  $("#clearChat").onclick=()=>{chatLog=[];$("#starters").hidden=false;draw()};
};
function fmt(t){
  let s=esc(t);
  s=s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  s=s.replace(/([㐀-鿿豈-﫿\u{20000}-\u{2FA1F}，。！？、]+)/gu,m=>/[㐀-鿿豈-﫿\u{20000}-\u{2FA1F}]/u.test(m)?`<span class="zhs" title="Chạm để nghe">${m}</span>`:m);
  s=s.replace(/\b([a-z]{1,6}[1-6])\b/g,(m,a)=>`<span class="t${a.slice(-1)}" style="font-weight:800">${a}</span>`);
  return s.replace(/\n/g,"<br>");
}

/* mistakes */
VIEWS.mist=v=>{
  const kinds={tone:"Thanh điệu",pic:"Nghe hiểu",meaning:"Nghĩa từ",type:"Gõ Jyutping",swap:"Từ kiểu Quan thoại",song:"Bài hát",write:"Viết câu",cafe:"Hội thoại",number:"Số đếm",shadow:"Nhép theo"};
  const counts={}; state.mistakes.forEach(m=>counts[m.kind]=(counts[m.kind]||0)+1);
  const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  v.innerHTML=`<div class="stack"><div><h2>Sổ lỗi sai</h2><p class="muted">Mọi lỗi trong bài tập, trò chơi và bài hát được ghi lại ở đây kèm giải thích. Ôn lại mỗi tuần để không lặp lỗi.</p></div>

    <div class="row"><button class="btn" id="review">Ôn lại ${Math.min(8,state.mistakes.filter(m=>m.j).length)} lỗi gần nhất</button><button class="btn ghost sm" id="clearM">Xoá sổ lỗi</button></div><div id="confirmM"></div></section>
  <section class="card">${state.mistakes.map(m=>`<div class="mist">${m.h&&m.h.length<=8?sayBtn(m.h):""}<div style="flex:1;min-width:0"><div><span class="zh" style="font-size:1.2rem">${esc(m.h)}</span> ${m.j?jp(m.j):""} <span class="small muted">${esc(m.v||"")}</span></div><div class="small">${esc(m.note||"")}</div><div class="small muted">${kinds[m.kind]||""} · ${esc(m.date||"")}</div></div></div>`).join("")}</section>`
  :`<section class="card stack" style="align-items:center;text-align:center">${mascot(100)}<h3>Sổ lỗi đang trống</h3><p class="muted">Làm bài tập hôm nay hoặc chơi một trò chơi; lỗi sai sẽ xuất hiện ở đây kèm lời giải thích.</p><button class="btn" id="toDaily">Làm bài tập hôm nay</button></section>`}</div>`;
  v.onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.id==="toDaily"){go("home");setTimeout(()=>startDaily($("#view")),50)}
    if(b.id==="clearM"){$("#confirmM").innerHTML=`<div class="row"><span class="small">Xoá toàn bộ ${state.mistakes.length} lỗi?</span><button class="btn coral sm" id="yesM">Xoá</button><button class="btn ghost sm" id="noM">Giữ lại</button></div>`}
    if(b.id==="yesM"){state.mistakes=[];save();render()}
    if(b.id==="noM"){$("#confirmM").innerHTML=""}
    if(b.id==="review"){
      const items=state.mistakes.filter(m=>m.j&&tokenize(m.j).length<=7).slice(0,8);
      const qs=items.map(m=>m.kind==="tone"?(()=>{const set=TONE_SETS.find(s=>s.chars.includes(m.h));const i=set.chars.indexOf(m.h);const q=makeToneQ(()=>0);return {...q,say:m.h,h:m.h,j:m.j,v:m.v,prompt:`Nghe lại và chọn thanh của <b>${set.base}?</b>`,opts:[1,2,3,4,5,6].map(n=>({html:`<span class="t${n}" style="font-family:var(--display);font-size:1.2rem;font-weight:800">${n}</span>${toneSVG(n,90,44,false)}`,correct:n===i+1,why:n===i+1?"":toneTip(n,i+1)})),reveal:`${m.h} ${jp(m.j)}`}})()
        :{type:"type",kind:m.kind,say:m.h,autoSay:true,h:m.h,j:m.j,v:m.v,prompt:`Nghe và gõ Jyutping: <span class="zh" style="font-size:1.5rem">${esc(m.h)}</span><br><span class="small muted">${esc(m.v||"")}</span>`});
      v.onclick=null; runQuiz(v,qs,{title:"Ôn lỗi sai",onExit:()=>go("mist"),onDone:()=>{}});
    }};
};

  $("#showIcs").onclick=()=>{$("#icsOut").innerHTML=`<pre class="ics" id="icsPre">${esc(buildICS())}</pre><button class="btn ghost sm" id="cpIcs">Sao chép</button><p class="small muted">Có thể dán nội dung này vào một tệp tên <code>bao-bao-nhac-hoc.ics</code>.</p>`;$("#cpIcs").onclick=()=>copyText(buildICS(),$("#icsPre"))};
  $("#icsBtn").onclick=async()=>{
    if(!r.email) toast("Nhập email để lịch có kèm nhắc qua email nhé");
    if(downloadsNs){try{await downloadsNs.save({filename:"bao-bao-nhac-hoc.ics",data:new Blob([buildICS()],{type:"text/calendar"})});toast("Đã lưu tệp lịch nhắc")}catch(err){if(err?.code!=="declined"&&err?.code!=="cancelled")$("#showIcs").click()}}
    else $("#showIcs").click();
  };
};
function buildICS(){
  const r=state.reminder; const [hh,mm]=(r.time||"20:00").split(":");
  const d=new Date(); d.setDate(d.getDate()+1); const ymd=dayKey(d).replace(/-/g,"");
  const by=["SU","MO","TU","WE","TH","FR","SA"]; const days=r.days.map(x=>by[x]).join(",");
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  const desc="Đến giờ học tiếng Quảng với Bao Bao! 15–20 phút: phát âm, từ mới, bài tập hằng ngày (10 câu), hát đồng dao. Làm xong nhớ mở Phiếu nộp bài và gửi kết quả nhé. 加油！";
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Bao Bao//Hoc Tieng Quang//VI","CALSCALE:GREGORIAN","BEGIN:VEVENT",
    `UID:baobao-${Date.now()}@hoc-tieng-quang`,`DTSTAMP:${stamp}`,`DTSTART:${ymd}T${hh}${mm}00`,"DURATION:PT20M",
    `RRULE:FREQ=WEEKLY;BYDAY=${days}`,"SUMMARY:Nộp bài tiếng Quảng hôm nay (Bao Bao)",`DESCRIPTION:${desc}`,
    "BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:-PT0M","DESCRIPTION:Đến giờ học tiếng Quảng!","END:VALARM"];
  if(r.email) lines.push("BEGIN:VALARM","ACTION:EMAIL","TRIGGER:-PT0M",`ATTENDEE:mailto:${r.email}`,"SUMMARY:Nhắc nộp bài tiếng Quảng",`DESCRIPTION:${desc}`,"END:VALARM",
    "BEGIN:VALARM","ACTION:EMAIL","TRIGGER:PT3H",`ATTENDEE:mailto:${r.email}`,"SUMMARY:Bạn đã nộp bài tiếng Quảng hôm nay chưa?","DESCRIPTION:Nếu chưa, chỉ cần 10 phút cho bài tập hằng ngày thôi. 唔好放棄！(m4 hou2 fong3 hei3 - đừng bỏ cuộc!)","END:VALARM");
  lines.push("END:VEVENT","END:VCALENDAR");
  return lines.join("\r\n");
}
